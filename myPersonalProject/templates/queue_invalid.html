<!DOCTYPE html>
<html lang="de">
<head>

    <title>Link ungültig – Flowline</title>

        h1 { font-size: 20px; font-weight: 700; color: #111827; margin-bottom: 10px; }
        p { font-size: 14px; color: #6b7280; line-height: 1.6; }
        .logo { font-size: 12px; color: #9ca3af; margin-top: 28px; }
    </style>
</head>

    <div class="card">
